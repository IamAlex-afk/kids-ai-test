name: Browser checks

# Playwright (Chromium) against the dist/ built from THIS commit, served
# locally under /kids-ai-test/ like GitHub Pages. Read-only: never deploys,
# no secrets. Report, failure screenshots and traces are uploaded.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Build dist/
        run: node tools/build.mjs --check
      - name: Serve dist/ at /kids-ai-test/
        run: mkdir -p site && ln -s "$PWD/dist" site/kids-ai-test
      - name: Install Playwright
        working-directory: e2e
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npx playwright install --with-deps chromium
          npx playwright --version
      - name: Run browser checks
        working-directory: e2e
        run: npx playwright test
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/report/
            e2e/results/
            e2e/package-lock.json
          retention-days: 14
